    <g transform="translate(700,36)"><rect width="160" height="120" rx="16" fill="#F3EDF7"/><path d="M12 108 C60 108 148 108 148 12" stroke="#B3261E" stroke-width="3" fill="none" stroke-linecap="round"/><text x="80" y="152" font-size="13" font-weight="500" fill="#1D1B20">accelerate</text><text x="80" y="170" font-size="11" fill="#49454F">0.3, 0, 1, 1</text></g>
    <text x="480" y="228" font-size="12" fill="#49454F">Enter: decelerate · Exit: accelerate · Move on screen: standard / emphasized</text>
